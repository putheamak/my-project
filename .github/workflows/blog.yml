name: Publish blog

# Builds content-engine/posts into a static site and publishes it to the
# gh-pages branch under /blog, next to the existing app (keep_files leaves the
# app's files alone). Live at https://putheamak.github.io/my-project/blog/
on:
  push:
    branches: [main]
    paths:
      - "content-engine/posts/**"
      - "content-engine/images/**"
      - "content-engine/site.json"
      - "content-engine/config.json"
      - "content-engine/build-blog.mjs"
      - "content-engine/compliance.mjs"
      - "content-engine/lib/**"
      - "content-engine/make-pins.mjs"
      - "content-engine/make-videos.mjs"
      - "content-engine/topics.json"
      - "content-engine/pin-queue.json"
      - ".github/workflows/blog.yml"
  # Commits made by the daily workflow don't trigger "push", so also run after it.
  workflow_run:
    workflows: ["Daily content pack"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build-blog.mjs
        working-directory: content-engine
      # Phone photos are often 3-8 MB. Shrink copies to at most 1600px so pages
      # load fast; the originals in content-engine/images are left untouched.
      - name: Shrink large photos
        working-directory: content-engine/dist-blog
        run: |
          if ! command -v mogrify >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick || true
          fi
          if command -v mogrify >/dev/null && [ -d images ]; then
            find images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) \
              -exec mogrify -auto-orient -resize '1600x1600>' -strip -quality 82 {} +
            du -ah images
          else
            echo "ImageMagick not available; publishing photos at original size"
          fi
      # Vertical Pinterest images (3 designs per post) and a page listing them
      # with the text to paste, at <blog>/pins/. Uses the ImageMagick above.
      # Short vertical videos (TikTok / Shorts / Pinterest) at <blog>/pins/<slug>.mp4.
      # Only new or changed posts are rendered (about a minute each); earlier
      # videos stay on the site because of keep_files below.
      - name: Make short videos
        working-directory: content-engine
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true
          fi
          node make-videos.mjs
      - name: Make Pinterest pin images
        working-directory: content-engine
        run: node make-pins.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: content-engine/dist-blog
          destination_dir: blog
          keep_files: true
          commit_message: "Publish blog"
      # Pinterest needs to fetch the post page and cover image, so give GitHub
      # Pages a moment to catch up before pinning. Only runs when
      # pinterest.autoPost is true in site.json (see content-engine/README.md).
      - name: Wait for GitHub Pages
        run: sleep 20
      - name: Post new pins to Pinterest
        working-directory: content-engine
        run: node post-pinterest.mjs
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      - name: Commit Pinterest posting history
        run: |
          if [ -f content-engine/output/pinterest-history.json ]; then
            git config user.name "content-bot"
            git config user.email "content-bot@users.noreply.github.com"
            git add content-engine/output/pinterest-history.json
            git diff --cached --quiet || git commit -m "Record pins posted to Pinterest"
            git diff --cached --quiet || git push
          fi
