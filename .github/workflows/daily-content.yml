name: Daily content pack

on:
  # Schedule removed 21 Nov 2026: the owner decided to shut the blog down.
  # It now runs only when started by hand (Actions tab, Run workflow).
  # To restart weekly drafts, add back:
  #   schedule:
  #     - cron: "17 23 * * 0"   # 06:17 Monday in Cambodia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node generate.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit today's pack
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add output posts
          git diff --cached --quiet || git commit -m "Add content pack and blog draft $(date -u +%F)"
          git push
