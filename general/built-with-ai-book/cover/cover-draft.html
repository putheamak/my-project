<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1600px;height:2560px;background:#12355B;font-family:"Inter","DejaVu Sans",sans-serif;color:#fff;overflow:hidden;position:relative}
  .glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.07),rgba(255,255,255,0) 70%)}
  .top{position:absolute;top:300px;left:0;right:0;text-align:center}
  .kicker{font-size:44px;letter-spacing:12px;color:#F08A14;font-weight:700;margin-bottom:70px}
  h1{margin:0;font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-size:205px;line-height:0.98;letter-spacing:-3px}
  h1 .o{color:#F08A14}
  .sub{margin-top:80px;font-size:68px;line-height:1.25;color:#DCE6F2;font-weight:400}
  .row{position:absolute;top:1430px;left:0;right:0;display:flex;justify-content:center;align-items:flex-start;gap:0}
  .item{width:270px;text-align:center}
  .tile{width:250px;height:250px;margin:0 auto;border:5px solid rgba(255,255,255,0.85);border-radius:48px;display:flex;align-items:center;justify-content:center}
  .label{margin-top:34px;font-size:40px;color:#DCE6F2;font-weight:600;letter-spacing:1px}
  .arrow{width:70px;height:250px;display:flex;align-items:center;justify-content:center}
  .bottom{position:absolute;bottom:230px;left:0;right:0;text-align:center}
  .rule{width:160px;height:8px;background:#F08A14;margin:0 auto 70px;border-radius:4px}
  .place{font-size:46px;color:#DCE6F2;margin-bottom:40px;letter-spacing:2px}
  .author{font-size:96px;font-weight:800;letter-spacing:20px}
</style></head>
<body>
<div class="glow" style="width:1400px;height:1400px;left:-500px;top:-450px"></div>
<div class="glow" style="width:1200px;height:1200px;right:-450px;bottom:-300px"></div>

<div class="top">
  <div class="kicker">REAL PROJECTS · HONESTLY BUILT</div>
  <h1>BUILT WITH AI,<br><span class="o">NO CODING</span></h1>
  <div class="sub">Real business tools, real costs,<br>real mistakes</div>
</div>

<div class="row">
  <div class="item"><div class="tile">
    <svg width="150" height="150" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="20" y="14" width="60" height="76" rx="8"/><rect x="36" y="8" width="28" height="12" rx="4"/>
      <path d="M32 40h36M32 54h36M32 68h20"/><path d="M58 70l6 6 12-14" stroke="#F08A14"/></svg>
  </div><div class="label">Booking app</div></div>
  <div class="arrow"><svg width="56" height="40" viewBox="0 0 56 40"><path d="M4 20h42M34 8l12 12-12 12" fill="none" stroke="#F08A14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="item"><div class="tile">
    <svg width="150" height="150" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="16" width="80" height="68" rx="8"/><path d="M10 32h80"/><circle cx="20" cy="24" r="1.5" fill="#fff"/><circle cx="28" cy="24" r="1.5" fill="#fff"/>
      <rect x="22" y="44" width="22" height="26" rx="3" stroke="#F08A14"/><path d="M54 46h24M54 58h24M54 70h16"/></svg>
  </div><div class="label">Blog</div></div>
  <div class="arrow"><svg width="56" height="40" viewBox="0 0 56 40"><path d="M4 20h42M34 8l12 12-12 12" fill="none" stroke="#F08A14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="item"><div class="tile">
    <svg width="150" height="150" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="28" y="8" width="44" height="84" rx="9"/><path d="M44 16h12"/>
      <path d="M43 38v24l20-12z" stroke="#F08A14" fill="#F08A14"/></svg>
  </div><div class="label">Video ads</div></div>
  <div class="arrow"><svg width="56" height="40" viewBox="0 0 56 40"><path d="M4 20h42M34 8l12 12-12 12" fill="none" stroke="#F08A14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="item"><div class="tile">
    <svg width="150" height="150" viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 26c-10-8-24-10-38-8v60c14-2 28 0 38 8 10-8 24-10 38-8V18c-14-2-28 0-38 8z"/><path d="M50 26v60"/>
      <path d="M22 36h18M22 48h18M60 36h18" stroke="#F08A14"/></svg>
  </div><div class="label">Ebook</div></div>
</div>

<div class="bottom">
  <div class="rule"></div>
  <div class="place">A small-business owner in Cambodia</div>
  <div class="author">MAK PUTHEA</div>
</div>
</body></html>
